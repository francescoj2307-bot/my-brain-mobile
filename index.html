<style>

actions{display:flex;justify-content:flex-end;gap:9px}.muted{color:var(--muted)}.timeline{border-left:2px solid #3e6b5a;padding:4px 0 4px 15px}.timeline>div{margin:0 0 16px;position:relative}.timeline>div:before{content:"";position:absolute;left:-22px;top:7px;background:var(--mint);border-radius:99px;width:10px;height:10px}.right{display:flex;gap:8px;align-items:center}.check{accent-color:#80dfb7;width:20px;height:20px}.sectiontitle{display:flex;align-items:center;justify-content:space-between;gap:12px}.notice{border-left:3px solid var(--mint);padding:12px 14px;background:var(--panel2);border-radius:7px}.hidden{display:none!important}dialog{background:var(--panel);color:var(--text);border:1px solid #54746c;box-shadow:0 12px 60px #0009;border-radius:20px;width:min(540px,94vw);max-height:90dvh;overflow:auto;padding:22px}dialog::backdrop{background:#0009}#toast{position:fixed;left:50%;bottom:91px;transform:translateX(-50%);border:1px solid #53715f;border-radius:12px;background:#214337;color:white;padding:12px 18px;z-index:20;display:none}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.shell{grid-template-columns:180px 1fr}.sidebar{padding:18px 8px}main{padding:18px 20px 94px}}@media(max-width:650px){.shell{display:block}.sidebar{display:none}main{padding:22px 15px 112px}.top{align-items:flex-start}h1{font-size:27px}.grid{gap:9px}.card{padding:15px}.big{font-size:25px}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#102325ee;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 4px max(8px,env(safe-area-inset-bottom));z-index:8}.bottom button{font-size:10px;white-space:nowrap;border:0;background:transparent;padding:6px 0;color:var(--muted)}.bottom button.active{color:var(--mint)}.bottom button span{display:block;font-size:20px}.form .pair{grid-template-columns:1fr}}

.mac-panel{background:#132b2b;border:1px solid #396056;border-radius:16px;padding:13px 16px;margin:0 0 17px}
.mac-panel strong{color:#9de5c2}.mac-panel p{font-size:12px;line-height:1.4;margin:5px 0 9px}

</style></head><body>
<div class="shell"><aside class="sidebar"><div class="brand">✳ My <span>Brain</span><div class="tagline">Il mio cervello digitale</div></div><nav id="sidenav" class="nav"></nav><div class="footer">● Local-first<br>I contenuti restano sul dispositivo. Esporta periodicamente un backup.</div></aside><main><header class="top"><div><div class="eyebrow">MY BRAIN · MOBILE</div><h1 id="title">Il tuo cervello digitale</h1><p id="subtitle"></p></div><button class="accent" id="add">＋ Nuovo</button></header><div id="content"></div></main></div><nav id="bottomnav" class="bottom"></nav><dialog id="editor"><div class="sectiontitle"><h2 id="editorTitle">Nuova memoria</h2><button id="close" class="ghost" aria-label="Chiudi">✕</button></div><form id="entryform" class="form"><label>Titolo<input name="title" maxlength="240" required placeholder="Un'idea, un obiettivo…"></label><div class="pair"><label>Area<select name="area" id="entryarea"></select></label><label>Tipo<select name="kind"><option value="idea">Idea</option><option value="note">Nota</option><option value="task">Azione</option><option value="knowledge">Conoscenza</option><option value="project">Progetto</option><option value="decision">Decisione</option><option value="goal">Obiettivo</option><option value="signal">Segnale</option><option value="state_change">Cambiamento</option></select></label></div><label>Descrizione<textarea name="body" maxlength="25000" placeholder="Contesto, idee e prossimi passi…"></textarea></label><div class="pair"><label>Scadenza<input name="due" type="date"></label><label>Priorità<select name="priority"><option value="normal">Normale</option><option value="high">Alta</option><option value="low">Bassa</option></select></label></div><label>Tag (separati da virgola)<input name="tags" placeholder="studio, investimenti, progetto"></label><div class="actions"><button type="button" id="cancel">Annulla</button><button type="submit" class="accent">Salva</button></div></form></dialog><div id="toast" role="s <script>
(function(){
'use strict';
var AREAS={apprendimento:['Apprendimento','◇','Ciò che sto imparando'],progetti:['Progetti','↗','Ciò che sto costruendo'],obiettivi:['Obiettivi','◎','Dove voglio arrivare'],decisioni:['Decisioni','⚖','Come scelgo'],evoluzione:['Evoluzione','✳','Come sto cambiando']};
var PAGES=[['home','⌂','Home'],['mappa','◎','Mappa'],['oggi','✓','Oggi'],['inbox','✦','Inbox'],['archivio','▤','Archivio'],['timeline','◷','Timeline'],['impostazioni','⚙','Impostazioni']];
var key='my-brain-mobile-v1',initial={version:1,entries:[],events:[]},db,route='home',areaFilter='',query='',editId=null;
function fresh(){return JSON.parse(JSON.stringify(initial))}
try{db=JSON.parse(localStorage.getItem(key)||'null');if(!db||!Array.isArray(db.entries)||!Array.isArray(db.events))db=fresh()}catch(e){db=fresh()}
for(const entry of db.entries){if(entry.area==='persona')entry.area='obiettivi';else if(entry.area==='conoscenza')entry.area='apprendimento';else if(entry.area==='crescita')entry.area='evoluzione'}
function byId(id){return document.getElementById(id)}
function el(tag,txt,cls){var n=document.createElement(tag);if(txt!==undefined&&txt!==null)n.textContent=String(txt);if(cls)n.className=cls;return n}
function append(parent){Array.prototype.slice.call(arguments,1).forEach(function(child){if(child)parent.appendChild(child)});return parent}
function button(txt,fn,cls){var b=el('button',txt,cls);b.type='button';b.addEventListener('click',fn);return b}
function now(){return new Date().toISOString()}
function fmt(s){return s?new Date(s).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'}):'—'}
function uid(){return globalThis.crypto&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36)}
function save(){localStorage.setItem(key,JSON.stringify(db))}
function log(title){db.events.unshift({id:uid(),title:title,at:now()});db.events=db.events.slice(0,1500)}
function alertToast(s){var t=byId('toast');t.textContent=s;t.style.display='block';clearTimeout(window.toastT);window.toastT=setTimeout(function(){t.style.display='none'},2300)}
function approved(){return db.entries.filter(function(x){return x.area!=='inbox'})}
function inbox(){return db.entries.filter(function(x){return x.area==='inbox'})}
function tasks(){return approved().filter(function(x){return x.kind==='task'&&x.status!=='done'})}
function counts(a){return approved().filter(function(x){return x.area===a}).length}
function nav(){['sidenav','bottomnav'].forEach(function(id){var node=byId(id);node.replaceChildren();PAGES.forEach(function(p){if(id==='bottomnav'&&['timeline','impostazioni'].indexOf(p[0])>=0)return;var b=button((id==='bottomnav'?p[1]+' ':'')+p[2],function(){go(p[0])},p[0]===route?'active':'');if(id==='bottomnav'){b.replaceChildren(el('span',p[1]),document.createTextNode(p[2]))}node.appendChild(b)})})}
function go(p,a){route=p;areaFilter=a||'';query='';render();window.scrollTo(0,0)}
function section(title){var s=el('section',null,'card');append(s,el('h2',title));return s}
function empty(text){return el('div',text,'empty')}
function item(row,actions){var d=el('div',null,'item');var content=el('div',null,'item-text');append(content,el('b',row.title),el('small', (AREAS[row.area]?AREAS[row.area][0]:'Inbox')+' · '+row.kind+' · '+fmt(row.updated||row.created)));if(row.body)append(content,el('div',row.body.slice(0,220),'detail'));append(d,content);var right=el('div',null,'right');(actions||[]).forEach(function(x){append(right,button(x[0],x[1],x[2]||'ghost'))});append(d,right);return d}
function entryList(rows,mode){var l=el('div',null,'list');if(!rows.length)return empty('Non ci sono ancora elementi.');rows.forEach(function(x){var acts=[];if(mode==='inbox')acts.push(['Classifica',function(){edit(x.id)},'accent']);if(x.kind==='task')acts.push([x.status==='done'?'↩':'✓',function(){toggle(x.id)}]);if(x.original&&x.original.entity)acts.push(['Mac',function(){window.MyBrainMobileOfficial?.showOriginal(x.original.entity,x.original.id)}]);acts.push(['✎',function(){edit(x.id)}]);l.appendChild(item(x,acts))});return l}
function areaButton(id){var a=AREAS[id],b=el('button',null,'');append(b,el('span',a[1],'em'),el('strong',a[0]),el('small',a[2]+' · '+counts(id)+' elementi'));b.addEventListener('click',function(){go('archivio',id)});return b}
function areaMap(){var g=el('div',null,'network');Object.keys(AREAS).slice(0,2).forEach(function(a){g.appendChild(areaButton(a))});append(g,el('div',null,'hub'));append(g.querySelector('.hub'),el('div','✳','big'),el('b','MY BRAIN'),el('div','Il mio sistema','caption'));Object.keys(AREAS).slice(2).forEach(function(a){g.appendChild(areaButton(a))});return g}
function capture(){var f=el('form',null,'capture'),inp=el('input'),submit=el('button','Salva','accent');inp.placeholder='Cattura al volo un pensiero…';inp.required=true;submit.type='submit';append(f,inp,submit);f.addEventListener('submit',function(ev){ev.preventDefault();var t=inp.value.trim();if(!t)return;db.entries.unshift({id:uid(),title:t.slice(0,240),body:'',area:'inbox',kind:'idea',status:'inbox',created:now(),updated:now(),tags:[],priority:'normal',due:''});log('Nuova idea nella Inbox');save();render();alertToast('Idea salvata')});return f}
function home(){var root=el('div'),stat=el('div',null,'grid');[['Memorie',approved().length],['Inbox',inbox().length],['Azioni aperte',tasks().length],['Eventi',db.events.length]].forEach(function(x){var box=el('div',null,'card');append(box,el('div',x[0],'caption'),el('div',x[1],'big'));stat.appendChild(box)});root.appendChild(stat);var split=el('div',null,'split'),left=el('div',null,'stack'),right=el('div',null,'stack'),map=section('La tua mappa'),cap=section('Cattura veloce'),today=section('Le priorità di oggi'),reviews=section('Da classificare');append(map,areaMap());append(cap,capture());append(today,entryList(tasks().slice(0,4)));append(reviews,entryList(inbox().slice(0,3),'inbox'));append(left,map,cap);append(right,today,reviews);append(split,left,right);root.appendChild(split);return root}
function archive(){var root=el('div'),tools=el('div',null,'toolbar'),search=el('input'),select=el('select');search.placeholder='Cerca in My Brain…';select.appendChild(new Option('Tutte le aree',''));Object.keys(AREAS).forEach(function(a){select.appendChild(new Option(AREAS[a][0],a))});select.value=areaFilter;search.value=query;select.addEventListener('change',function(){areaFilter=select.value;drawArchive(root)});search.addEventListener('input',function(){query=search.value.toLowerCase();drawArchive(root)});append(tools,search,select);append(root,tools,el('div',null,'results'));function drawArchive(r){var rows=approved().filter(function(x){return (!areaFilter||x.area===areaFilter)&&(!query||(x.title+' '+x.body+' '+(x.tags||[]).join(' ')).toLowerCase().includes(query))});rows.sort(function(a,b){return (b.updated||'').localeCompare(a.updated||'')});r.querySelector('.results').replaceChildren(entryList(rows))}drawArchive(root);return root}
function today(){var r=el('div',null,'stack'),card=section('Attività aperte');append(card,entryList(tasks()));r.appendChild(card);return r}
function timeline(){var c=section('La tua evoluzione'),list=el('div',null,'timeline');if(!db.events.length)append(c,empty('La tua timeline inizierà quando aggiungerai una memoria.'));db.events.forEach(function(e){var n=el('div');append(n,el('b',e.title),el('div',fmt(e.at),'date'));list.appendChild(n)});append(c,list);return c}
function map(){var s=section('Cinque aree, una direzione');append(s,areaMap());return s}
function review(){var s=section('Gatekeeper · Da classificare');append(s,el('p','Trasforma un pensiero in una nota, una decisione, un progetto o un’attività.'));append(s,el('div',null,'caption'));append(s,entryList(inbox(),'inbox'));append(s,capture());return s}
function settings(){var r=el('div',null,'stack'),s=section('Dati e privacy'),b=section('Backup');append(s,el('p','My Brain Mobile conserva i contenuti in questo browser. Nessuna informazione viene inviata al repository GitHub o al server del sito.'),el('div','Nessuna sincronizzazione con il My Brain Mac in questa versione.','notice'));append(b,el('p','Esporta periodicamente il tuo archivio JSON; se cancelli i dati del browser potresti perdere le memorie.'));append(b,button('Esporta backup JSON',exportBackup,'accent'),document.createTextNode(' '),button('Importa backup',function(){byId('importinput').click()}));append(r,s,b);return r}
function render(){nav();var names={home:['Il tuo cervello digitale','Organizza. Ricorda. Cresci.'],mappa:['La tua mappa','Un luogo per ogni pensiero.'],oggi:['Oggi','Concentrati su ciò che conta.'],inbox:['Inbox','Dalle intuizioni alle decisioni.'],archivio:['Archivio','Le tue conoscenze, a portata di mano.'],timeline:['Timeline','La traccia della tua evoluzione.'],impostazioni:['Impostazioni','I tuoi dati sotto controllo.']};byId('title').textContent=names[route][0];byId('subtitle').textContent=names[route][1];var v={home:home,mappa:map,oggi:today,inbox:review,archivio:archive,timeline:timeline,impostazioni:settings};byId('content').replaceChildren(v[route]())}
function edit(id){editId=id||null;var x=db.entries.find(function(e){return e.id===id}),f=byId('entryform');f.reset();var a=byId('entryarea');a.replaceChildren(new Option('Inbox · da classificare','inbox'));Object.keys(AREAS).forEach(function(k){a.appendChild(new Option(AREAS[k][0],k))});f.elements.title.value=x?x.title:'';f.elements.body.value=x?x.body:'';f.elements.area.value=x?x.area:(areaFilter||'inbox');f.elements.kind.value=x?x.kind:'idea';f.elements.priority.value=x?x.priority||'normal':'normal';f.elements.due.value=x?x.due||'':'';f.elements.tags.value=x?(x.tags||[]).join(', '):'';byId('editorTitle').textContent=x?'Modifica memoria':'Nuova memoria';byId('editor').showModal()}
function toggle(id){var x=db.entries.find(function(e){return e.id===id});if(!x)return;x.status=x.status==='done'?'active':'done';x.updated=now();log(x.status==='done'?'Azione completata':'Azione riaperta');save();render()}
byId('entryform').addEventListener('submit',function(ev){ev.preventDefault();var f=ev.target,fd=new FormData(f),title=String(fd.get('title')||'').trim();if(!title)return;var x=db.entries.find(function(e){return e.id===editId}),a=String(fd.get('area'));var e={id:x?x.id:uid(),title:title.slice(0,240),body:String(fd.get('body')||'').slice(0,25000),area:a,kind:String(fd.get('kind')),status:a==='inbox'?'inbox':x&&x.status==='done'?'done':'active',due:String(fd.get('due')||''),priority:String(fd.get('priority')||'normal'),tags:String(fd.get('tags')||'').split(',').map(function(t){return t.trim()}).filter(Boolean).slice(0,12),created:x?x.created:now(),updated:now()};if(x)Object.assign(x,e);else db.entries.unshift(e);log(x?'Memoria aggiornata: '+e.title:'Nuova memoria: '+e.title);save();byId('editor').close();render();alertToast('Salvato')});
function exportBackup(){var a=document.createElement('a'),blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob);a.href=url;a.download='my-brain-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},2000)}
byId('importinput').addEventListener('change',async function(ev){var file=ev.target.files[0];if(!file)return;if(file.size>20*1024*1024){alert('Il backup è troppo grande');return}try{var x=JSON.parse(await file.text());if(!x||x.version!==1||!Array.isArray(x.entries)||!Array.isArray(x.events))throw Error('Formato non valido');if(!confirm('Sostituire i dati presenti su questo dispositivo con il backup?'))return;db=x;save();render();alertToast('Backup importato')}catch(e){alert('Importazione non riuscita: '+e.message)}ev.target.value=''});
byId('add').addEventListener('click',function(){edit()});byId('cancel').addEventListener('click',function(){byId('editor').close()});byId('close').addEventListener('click',function(){byId('editor').close()});
window.MyBrainMobileBridge={
 snapshot:()=>JSON.parse(JSON.stringify(db)),
 replaceEntries:(entries,macInfo)=>{
   if(!Array.isArray(entries))throw new Error("Importazione non valida");
   const previous=db;
   db={...db,entries,macImport:macInfo};
   try{save()}catch(e){db=previous;throw e}
   render();
 }
};
render();
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost'))navigator.serviceWorker.register('./sw.js').catch(function(e){console.warn('Cache offline non disponibile',e)});
})();
</script><script src="./official-mac-import.js?v=3" defer></script></body></html>
